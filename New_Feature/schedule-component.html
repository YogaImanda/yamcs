<h2>Scheduled scripts</h2>

<!-- Debug kecil; kalau mau boleh dihapus nanti -->
<p style="font-size: 12px; opacity: .6;">
  loading={{ loading }} |
  items={{ items?.length || 0 }} |
  error={{ lastError || 'none' }}
</p>

<div *ngIf="loading">
  Loading...
</div>

<div *ngIf="!loading && lastError" style="color: red; margin-top: 8px;">
  Error: {{ lastError }}
</div>

<table *ngIf="!loading && !lastError" class="ya-table">
  <thead>
    <tr>
      <th>Id</th>
      <th>Start</th>
      <th>
