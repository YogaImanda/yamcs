<h2>Scheduled scripts</h2>

<div *ngIf="loading">Loading…</div>

<div *ngIf="!loading && !items.length">
  <p>No scheduled script found in the selected window.</p>
</div>

<table class="ya-table" *ngIf="!loading && items.length">
  <thead>
    <tr>
      <th>Script</th>
      <th>Start time (UTC)</th>
      <th>Tags</th>
      <!-- nanti bisa tambah kolom lain -->
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let item of items">
      <td>{{ item.name }}</td>
      <td>{{ item.start | date:'yyyy-MM-dd HH:mm:ss':'UTC' }}</td>
      <td>
        <ng-container *ngIf="item.tags?.length; else noTags">
          <span *ngFor="let tag of item.tags; let last = last">
            {{ tag }}<span *ngIf="!last">, </span>
          </span>
        </ng-container>
        <ng-template #noTags>–</ng-template>
      </td>
    </tr>
  </tbody>
</table>
